
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select Location</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-surface: rgba(22, 30, 46, 0.65);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-bg-hover: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.4);
      --accent-primary: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text-strong: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 24px;
      --radius-md: 16px;
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-strong);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Seamless Ambient Background Glows */
    .ambient-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      animation: pulseGlow 12s infinite alternate ease-in-out;
    }

    .glow-blob-1 {
      width: 500px;
      height: 500px;
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
    }

    .glow-blob-2 {
      width: 600px;
      height: 600px;
      bottom: -150px;
      right: -100px;
      background: radial-gradient(circle, #a855f7 0%, transparent 70%);
      animation-delay: -6s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      100% { transform: scale(1.15) translate(30px, -20px); opacity: 0.55; }
    }

    /* Container & Glass Panel */
    main.container {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      max-width: 1140px;
    }

    .glass-panel {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 32px;
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Header & Controls */
    .header-content h1 {
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-content p {
      color: var(--text-muted);
      font-size: 0.975rem;
      margin: 0;
    }

    /* Search Input Styling */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
      transition: var(--transition-smooth);
    }

    .search-box input {
      width: 100%;
      padding: 13px 44px 13px 46px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-strong);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-box input::placeholder {
      color: #64748b;
    }

    .search-box input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: rgba(15, 23, 42, 0.85);
    }

    .search-box input:focus + .search-icon {
      color: var(--accent-primary);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-smooth);
    }

    .clear-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .clear-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-strong);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Location Grid */
    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* Location Cards */
    .location-card {
      position: relative;
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 24px 20px;
      text-align: center;
      border: 1px solid var(--card-border);
      text-decoration: none;
      color: var(--text-strong);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: var(--transition-smooth);
      overflow: hidden;
      cursor: pointer;
    }

    .location-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(99, 102, 241, 0.15), transparent 70%);
      opacity: 0;
      transition: var(--transition-smooth);
    }

    .location-card:hover,
    .location-card:focus-visible {
      transform: translateY(-6px) scale(1.01);
      background: var(--card-bg-hover);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
      outline: none;
    }

    .location-card:hover::before,
    .location-card:focus-visible::before {
      opacity: 1;
    }

    /* Icon Container */
    .icon-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      transition: var(--transition-smooth);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .location-card:hover .icon-wrapper {
      transform: scale(1.1);
      border-color: rgba(99, 102, 241, 0.4);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
    }

    .location-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--text-strong);
    }

    .location-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    .action-badge {
      margin-top: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-smooth);
    }

    .location-card:hover .action-badge {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .action-badge i {
      transition: transform 0.2s ease;
    }

    .location-card:hover .action-badge i {
      transform: translateX(3px);
    }

    /* Empty State */
    .empty-state {
      display: none;
      text-align: center;
      padding: 48px 16px;
    }

    .empty-state.visible {
      display: block;
    }

    .empty-icon {
      font-size: 3rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* Entry Animations */
    .animate-fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      main.container { padding: 20px 12px; }
      .glass-panel { padding: 20px; border-radius: 20px; }
      .header-content h1 { font-size: 1.5rem; }
      .locations-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .location-card { padding: 18px 12px; }
      .icon-wrapper { width: 52px; height: 52px; font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effect Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>
  </div>

  <main class="container">
    <div class="glass-panel" role="region" aria-label="Select location panel">

      <!-- Header Row -->
      <div class="row gy-3 align-items-center justify-content-between">
        <div class="col-12 col-md-6 header-content">
          <h1>Explore Nearby</h1>
          <p>Select a location to discover local shops and offers</p>
        </div>

        <div class="col-12 col-md-5 col-lg-4">
          <div class="search-box">
            <input id="locationSearch" type="search" autocomplete="off" placeholder="Search neighborhood or city..." aria-label="Search locations" />
            <i class="bi bi-search search-icon"></i>
            <button id="clearSearch" class="clear-btn" title="Clear search" aria-label="Clear search">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Admin Navigation Button -->
      <div class="d-flex justify-content-end mt-3">
        <a href="/admin" class="btn btn-outline-light rounded-pill px-4">
          <i class="bi bi-gear-fill me-2"></i> Go to Admin
        </a>
      </div>

      <!-- Status Bar -->
      <div class="status-bar">
        <span>Available Regions</span>
        <span id="resultsCount">Showing all locations</span>
      </div>

      <!-- Locations Grid -->
      <div id="locationsGrid" class="locations-grid" aria-live="polite">
        {% for loc in locations %}
        <a href="{{ url_for('location', loc_id=loc[0]) }}"
           class="location-card animate-fade-in"
           data-name="{{ loc[1]|lower }}"
           data-id="{{ loc[0] }}"
           data-title="{{ loc[1]|e }}"
           role="button"
           aria-label="Explore shops in {{ loc[1] }}"
           tabindex="0">

          <div class="icon-wrapper" aria-hidden="true">
            <i class="bi bi-geo-alt-fill text-indigo"></i>
          </div>

          <div>
            <h3 class="location-title">{{ loc[1] }}</h3>
            <p class="location-sub">Click to explore</p>
          </div>

          <div class="action-badge">
            View Shops <i class="bi bi-arrow-right"></i>
          </div>
        </a>
        {% endfor %}
      </div>

      <!-- Empty Search Results State -->
      <div id="emptyState" class="empty-state animate-fade-in" aria-live="polite">
        <i class="bi bi-compass empty-icon"></i>
        <h4 class="fw-bold mb-1">No locations found</h4>
        <p class="text-muted fs-7 mb-0">Try searching for a different area or neighborhood.</p>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      'use strict';

      const searchInput = document.getElementById('locationSearch');
      const clearBtn = document.getElementById('clearSearch');
      const grid = document.getElementById('locationsGrid');
      const emptyState = document.getElementById('emptyState');
      const resultsCount = document.getElementById('resultsCount');
      const cards = Array.from(grid.querySelectorAll('.location-card'));
      const totalCards = cards.length;

      // Stagger initial card animations
      cards.forEach((card, idx) => {
        card.style.animationDelay = `${idx * 40}ms`;
      });

      function filterLocations(query) {
        const term = (query || '').trim().toLowerCase();
        let visibleCount = 0;

        cards.forEach(card => {
          const name = card.dataset.name || '';
          const isVisible = !term || name.includes(term);

          if (isVisible) {
            card.style.display = '';
            visibleCount++;
          } else {
            card.style.display = 'none';
          }
        });

        // Toggle Clear Button
        clearBtn.classList.toggle('visible', term.length > 0);

        // Toggle Empty State
        if (visibleCount === 0 && totalCards > 0) {
          emptyState.classList.add('visible');
          grid.style.display = 'none';
          resultsCount.textContent = '0 results found';
        } else {
          emptyState.classList.remove('visible');
          grid.style.display = 'grid';
          resultsCount.textContent = term ? `Showing ${visibleCount} location(s)` : 'Showing all locations';
        }
      }

      // Debounced search handler for smooth UI performance
      function debounce(fn, delay = 120) {
        let timer;
        return function (...args) {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      searchInput.addEventListener('input', debounce((e) => filterLocations(e.target.value)));

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        filterLocations('');
        searchInput.focus();
      });

      // Keyboard Accessibility: Space or Enter triggers card links
      cards.forEach(card => {
        card.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            const href = card.getAttribute('href');
            if (href) window.location.href = href;
          }
        });
      });

      // Initial filter setup
      filterLocations('');
    })();
  </script>
</body>
</html>
