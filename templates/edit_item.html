<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Edit {{ item[1] }}</h1>
    <form method="POST">
        <input type="hidden" name="item_id" value="{{ item[0] }}">
        <div class="mb-3">
            <label>Item Name</label>
            <input class="form-control" type="text" value="{{ item[1] }}" disabled>
        </div>
        <div class="mb-3">
            <label>Category</label>
            <input class="form-control" type="text" value="{{ item[2] }}" disabled>
        </div>
        <div class="mb-3">
            <label>Price</label>
            <input class="form-control" type="number" step="0.01" name="price" value="{{ item[3] }}" required>
        </div>

        <!-- If you want to allow changing shop, include this select. Otherwise include a hidden shop_id -->
        <div class="mb-3">
            <label>Shop</label>
            <select class="form-control" name="shop_id" required>
                {% for shop in shops %}
                    <option value="{{ shop[0] }}" {% if shop[0] == item[5] %}selected{% endif %}>{{ shop[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="out_of_stock" name="is_out_of_stock" value="1" {% if item[7] %}checked{% endif %}>
            <label class="form-check-label" for="out_of_stock">Out of stock</label>
        </div>

        <button class="btn btn-success">Update</button>
    </form>
</body>
</html>
