<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Edit {{ item[1] }}</h1>
    <form method="POST">
        <div class="mb-3">
            <label>Item Name</label>
            <input class="form-control" type="text" value="{{ item[1] }}" disabled>
        </div>
        <div class="mb-3">
            <label>Category</label>
            <input class="form-control" type="text" value="{{ item[2] }}" disabled>
        </div>
        <div class="mb-3">
            <label>Price</label>
            <input class="form-control" type="number" step="0.01" name="price" value="{{ item[3] }}" required>
        </div>
        <button class="btn btn-success">Update Price</button>
    </form>
</body>
</html>
