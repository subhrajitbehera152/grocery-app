<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - Grocery Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; background: #f3f6fb; color: #172033; }
        .page-wrap { max-width: 850px; margin: 48px auto; padding: 0 16px; }
        .editor-card { background: #fff; border: 1px solid #e4eaf3; border-radius: 18px; box-shadow: 0 14px 40px rgba(30,50,80,.09); overflow: hidden; }
        .editor-head { padding: 26px 30px; color: #fff; background: linear-gradient(120deg,#172554,#4f46e5); }
        .editor-body { padding: 30px; }
        .form-label { font-weight: 700; color: #475569; font-size: .85rem; }
        .form-control, .form-select { min-height: 46px; border-color: #dbe3ef; border-radius: 10px; }
        .form-control:focus, .form-select:focus { border-color: #818cf8; box-shadow: 0 0 0 .2rem rgba(99,102,241,.14); }
        .btn-save { border: 0; border-radius: 10px; padding: 11px 22px; color: #fff; font-weight: 700; background: linear-gradient(120deg,#4f46e5,#7c3aed); }
        .btn-cancel { border-radius: 10px; padding: 11px 22px; font-weight: 700; }
        .stock-box { padding: 16px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; }
        @media(max-width:576px) { .editor-head,.editor-body { padding: 22px 18px; } .page-wrap { margin: 20px auto; } }
    </style>
</head>
<body>
<div class="page-wrap">
    <div class="editor-card">
        <div class="editor-head">
            <div class="d-flex align-items-center gap-3">
                <div class="rounded-3 bg-white bg-opacity-25 p-3"><i class="bi bi-pencil-square fs-4"></i></div>
                <div><h1 class="h3 fw-bold mb-1">Edit Product</h1><div class="text-white-50">Update product details and availability.</div></div>
            </div>
        </div>
        <div class="editor-body">
            {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="row g-4">
                    <div class="col-md-6"><label class="form-label" for="name">Product Name</label><input class="form-control" id="name" type="text" name="name" value="{{ item[1] }}" required></div>
                    <div class="col-md-6"><label class="form-label" for="category">Category</label><input class="form-control" id="category" type="text" name="category" value="{{ item[2] }}" required></div>
                    <div class="col-md-6"><label class="form-label" for="price">Price (₹)</label><input class="form-control" id="price" type="number" min="0" step="0.01" name="price" value="{{ item[3] }}" required></div>
                    <div class="col-md-6"><label class="form-label" for="photo">Image URL</label><input class="form-control" id="photo" type="url" name="photo" value="{{ item[4] or '' }}" placeholder="https://example.com/image.jpg"></div>
                    <div class="col-12"><label class="form-label" for="shop_id">Shop</label>
                        <select class="form-select" id="shop_id" name="shop_id" required>
                            {% for shop in shops %}<option value="{{ shop[0] }}" {% if shop[0] == item[5] %}selected{% endif %}>{{ shop[1] }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12"><div class="stock-box">
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="is_out_of_stock" name="is_out_of_stock" value="1" {% if item[6] %}checked{% endif %}><label class="form-check-label fw-bold" for="is_out_of_stock">Mark as Out of Stock</label></div>
                        <div class="form-text mt-2">Shoppers will see “Out of Stock” and cannot add this product to their cart while enabled.</div>
                    </div></div>
                    <div class="col-12 d-flex flex-wrap justify-content-end gap-2 pt-2">
                        <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary btn-cancel"><i class="bi bi-arrow-left me-1"></i> Cancel</a>
                        <button type="submit" class="btn btn-save"><i class="bi bi-check2-circle me-1"></i> Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
