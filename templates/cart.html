<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1>Your Cart</h1>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price (per unit)</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for id, name, price, qty in items %}
            <tr>
                <td>{{ name }}</td>
                <td>{{ price }}</td>
                <td>{{ qty }}</td>
                <!-- ✅ Show subtotal for this item -->
                <td>{{ price * qty }}</td>
                <td>
                    <div class="d-flex align-items-center">
                        <a href="{{ url_for('update_cart', item_id=id, action='remove') }}" class="btn btn-danger btn-sm">-1</a>
                        <span class="mx-2">{{ qty }}</span>
                        <a href="{{ url_for('update_cart', item_id=id, action='add') }}" class="btn btn-success btn-sm">+1</a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- ✅ Show total for all items -->
    <h3>Total: {{ total }}</h3>

    <!-- Checkout Form -->
    <form method="POST" action="{{ url_for('place_order') }}">
        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Address</label>
            <input type="text" name="address" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Mobile</label>
            <input type="text" name="mobile" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Place Order</button>
    </form>

    <!-- Continue Shopping -->
    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Continue Shopping</a>
</body>
</html>
